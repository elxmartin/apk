name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'theme.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bundle Static Assets for Pages
        run: |
          if [ -f "theme.json" ]; then
            cp theme.json public/theme.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Final Static Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
