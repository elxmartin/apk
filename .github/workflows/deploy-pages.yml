name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'theme.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decrypt Status and Reports for Public Dashboard
        env:
          REPORT_ENCRYPTION_KEY: ${{ secrets.REPORT_ENCRYPTION_KEY }}
        run: |
          if [ -n "$REPORT_ENCRYPTION_KEY" ]; then
            if [ -f "public/status.enc" ]; then
              echo "[+] Decrypting status.enc to status.json..."
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                -pass pass:"$REPORT_ENCRYPTION_KEY" -a -A -in "public/status.enc" -out "public/status.json" || true
            fi

            echo "[+] Decrypting report bundles..."
            find public/reports -name "*.enc" | while read -r enc_file; do
              out_file="${enc_file%.enc}"
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                -pass pass:"$REPORT_ENCRYPTION_KEY" -a -A -in "$enc_file" 2>/dev/null | gzip -d > "$out_file" 2>/dev/null || true
            done
          fi

      - name: Bundle Static Assets for Pages
        run: |
          if [ -f "theme.json" ]; then
            cp theme.json public/theme.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Final Static Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
